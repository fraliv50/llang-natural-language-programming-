<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>llang playground</title>
<style>
body{background:#0f172a;color:#e2e8f0;font-family:ui-monospace,monospace;margin:0;padding:20px}
h1{font-size:20px;color:#38bdf8}
textarea{width:100%;height:300px;background:#1e293b;color:#e2e8f0;border:1px solid #334155;border-radius:8px;padding:12px;font-family:inherit;font-size:14px}
button{background:#2563eb;color:#fff;border:0;border-radius:8px;padding:10px 18px;cursor:pointer;font-size:14px;margin:12px 0}
button:hover{background:#1d4ed8}
input{background:#1e293b;color:#e2e8f0;border:1px solid #334155;border-radius:6px;padding:6px;width:80px}
pre{background:#1e293b;padding:12px;border-radius:8px;white-space:pre-wrap}
.note{color:#fbbf24}.err{color:#f87171}
</style>
</head>
<body>
<h1>llang playground — compiled to WebAssembly</h1>
<p>Write functions with integer parameters and a <code>give back</code> value, then compile and call an export.</p>
<textarea id="source">define function factorial taking n
    set result to 1
    set i to 1
    repeat while i is at most n
        set result to result times i
        set i to i plus 1
    end repeat
    give back result
end function
</textarea><br>
<button id="compile">Compile</button>
<label>export: <input id="export" value="factorial"></label>
<label>arg: <input id="arg" value="6"></label>
<button id="run">Run</button>
<pre id="out">Ready.</pre>
<script>
let bytes = null;
const out = document.getElementById('out');
document.getElementById('compile').onclick = async () => {
  out.textContent = 'compiling...';
  const source = document.getElementById('source').value;
  const response = await fetch('/compile', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({source})
  });
  const data = await response.json();
  if (data.error) { out.innerHTML = '<span class="err">' + data.error + '</span>'; return; }
  const binary = Uint8Array.from(atob(data.wasm), c => c.charCodeAt(0));
  try {
    const module = await WebAssembly.compile(binary);
    bytes = binary;
    window.instance = await WebAssembly.instantiate(module, {});
    let text = 'compiled ' + data.stats.bytes + ' bytes, ' + data.stats.functions + ' functions\n';
    for (const n of data.unsupported) text += '<span class="note">unsupported: ' + n + '</span>\n';
    for (const n of data.notes) text += '<span class="note">note: ' + n + '</span>\n';
    out.innerHTML = text;
  } catch (e) { out.innerHTML = '<span class="err">' + e + '</span>'; }
};
document.getElementById('run').onclick = () => {
  if (!window.instance) { out.textContent = 'compile first'; return; }
  const name = document.getElementById('export').value;
  const arg = Number(document.getElementById('arg').value);
  const fn = window.instance.exports[name];
  if (typeof fn !== 'function') { out.textContent = 'missing export: ' + name; return; }
  out.textContent = 'result: ' + fn(arg);
};
</script>
</body>
</html>
