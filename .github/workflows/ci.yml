name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.python-version == '3.12' || matrix.python-version == '3.13' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install llang with oracle dependencies
        run: pip install -e ".[dev]"
      - name: Run all checks
        run: python tools/check.py
      - name: CLI smoke test
        run: |
          llang examples/hello.ll
          llang --lint examples/report_card.ll
          llang --format examples/hello.ll > /dev/null
